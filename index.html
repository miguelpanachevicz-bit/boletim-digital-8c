<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cabeçalho com título e subtítulo -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano — Estudante Exemplo</p>
  </header>

  <main class="conteudo">

    <!-- Área dos cards de resumo -->
    <section class="cards" id="cards">
      <!-- Os cards serão criados pelo JavaScript -->
    </section>

    <!-- Área da tabela -->
    <section class="tabela-area">
      <h2 class="titulo-secao">Notas por Disciplina</h2>

      <div class="tabela-responsiva">
        <table class="tabela-boletim">
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As linhas serão criadas pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Rodapé simples -->
  <footer class="rodape">
    <p>Projeto escolar — dados fictícios para demonstração.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
