<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Garante que o site fique bom no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <!-- Conecta o CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano — Estudante Exemplo</p>
  </header>

  <!-- CARDS DE RESUMO -->
  <section class="cards">
    <div class="card">
      <span class="card-titulo">Média Geral</span>
      <span class="card-valor" id="card-media">—</span>
    </div>

    <div class="card">
      <span class="card-titulo">Total de Faltas</span>
      <span class="card-valor" id="card-faltas">—</span>
    </div>

    <div class="card">
      <span class="card-titulo">Bom Desempenho</span>
      <span class="card-valor" id="card-bom">—</span>
    </div>

    <div class="card">
      <span class="card-titulo">Precisam de Atenção</span>
      <span class="card-valor" id="card-atencao">—</span>
    </div>

    <div class="card">
      <span class="card-titulo">Frequência</span>
      <span class="card-valor" id="card-frequencia">—</span>
      <span class="card-extra" id="card-frequencia-status">—</span>
    </div>
  </section>

  <!-- TABELA DE NOTAS -->
  <section class="tabela-area">
    <table class="boletim">
      <thead>
        <tr>
          <th>Disciplina</th>
          <th>1º Tri</th>
          <th>2º Tri</th>
          <th>3º Tri</th>
          <th>Média</th>
          <th>Faltas</th>
          <th>Situação</th>
        </tr>
      </thead>
      <!-- As linhas são preenchidas pelo JavaScript -->
      <tbody id="corpo-tabela"></tbody>
    </table>
  </section>

  <!-- Conecta o JavaScript -->
  <script src="script.js"></script>
</body>
</html>
